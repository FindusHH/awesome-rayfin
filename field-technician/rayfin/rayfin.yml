id: field-technician
name: field-technician
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5173/auth/callback
      - http://localhost:5174
      - http://127.0.0.1:5174
      - https://key-river-c164fce3a9-northeurope.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: true
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build
    indexDocument: index.html
    assetAccess: protected
  functions:
    enabled: false
